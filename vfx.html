
<!DOCTYPE html>

        <a href="index.html" class="logo">

        <!-- FEATURED VIDEO PLAYER -->

        <section class="vfx-featured">

            <div class="vfx-featured-player">
                <video id="featuredVideo" controls playsinline></video>
            </div>

            <button class="vfx-item" type="button">

                <div class="vfx-preview">
                    <img src="Assets/vfx/reel.png" alt="Highlight Reel preview">

                    <video muted loop playsinline preload="none">
                        <source src="Assets/vfx/videos/HighlightReel.mp4" type="video/mp4">
                    </video>

                    <div class="vfx-overlay">
                        <span>Playing</span>
                    </div>
                </div>

                <div class="vfx-info">
                    <p>UNITY</p>
                    <h3>Highlight Reel</h3>
                </div>

            </button>
